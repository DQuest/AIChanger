[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
libadb = "3.1.1"
conscrypt = "2.5.3"
bouncycastle = "1.81"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
libadb-android = { group = "com.github.MuntashirAkon", name = "libadb-android", version.ref = "libadb" }
conscrypt-android = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }
# Та же линейка Bouncy Castle, что тянет libadb-android (bcprov-jdk15to18), иначе будут дубли классов.
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk15to18", version.ref = "bouncycastle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
