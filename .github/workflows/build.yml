name: Сборка APK

# Release-APK (R8, подписан debug-ключом) на каждый push в любую ветку и на pull request; вручную — кнопкой Run workflow во вкладке Actions.
# Тег v<версия> или ручной запуск на main ещё и выпускает релиз с этим APK и описанием из release-notes/v<версия>.md
# (при ручном запуске тег v<versionName> создаёт сам релиз; если релиз уже есть, обновляется только его описание).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Новый push в ту же ветку отменяет сборку предыдущего: нужен только последний APK.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Gradle 9 и AGP 9 требуют JDK 17+. Android SDK на ubuntu-latest уже есть,
      # недостающую платформу (compileSdk) AGP докачает сам: лицензии на раннере приняты.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Кэш зависимостей и сборки Gradle между запусками, заодно проверка gradle-wrapper.jar.
      # По умолчанию кэш сохраняет только основная ветка, а работа идёт в dev: без записи оттуда
      # каждая сборка скачивала бы все зависимости заново.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      # Debug- и release-сборки подписываются ключом ~/.android/debug.keystore, а на раннере он каждый раз новый.
      # APK с другой подписью Android не поставит поверх уже установленного (придётся удалять приложение
      # вместе с сопряжением). Если в секретах репозитория есть CHANGERKEY (keystore в base64) — тот же ключ,
      # что на компьютере разработчика, — CI-сборки ставятся поверх локальных и наоборот.
      - name: Debug-ключ из секретов
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.CHANGERKEY }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Используется debug-ключ из секретов"
          else
            echo "Секрета CHANGERKEY нет: APK подписан случайным ключом раннера"
          fi

      - name: Диагностика зависимостей (временно)
        continue-on-error: true
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath | grep -i -E "muntashir|bouncy|conscrypt" | sort -u
          mkdir -p /tmp/deps && cd /tmp/deps
          for f in $(find ~/.gradle/caches/modules-2/files-2.1 -ipath "*muntashir*" \( -name "*.aar" -o -name "*.jar" \) ! -name "*sources*"); do
            echo "=== $f"
            rm -rf x && mkdir x && cd x
            case "$f" in
              *.aar) unzip -q "$f"; [ -f proguard.txt ] && { echo "--- proguard.txt"; cat proguard.txt; }; jar=classes.jar ;;
              *) jar="$f" ;;
            esac
            unzip -q -o "$jar" -d cls 2>/dev/null || true
            find cls -name "*.class" | while read c; do
              hits=$(javap -c -p "$c" 2>/dev/null | grep -E "Class.forName|getDeclaredMethod|getDeclaredField|getMethod|getField|loadLibrary|ServiceLoader" | sort -u)
              [ -n "$hits" ] && { echo "--- $c"; echo "$hits"; }
            done
            cd ..
          done

      - name: Сборка и юнит-тесты
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Размер APK (временно)
        continue-on-error: true
        run: |
          ls -la app/build/outputs/apk/release/
          unzip -lv app/build/outputs/apk/release/app-release.apk | sort -k1 -n -r | head -15

      - name: Версия для имени артефакта
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: AIChanger-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

    outputs:
      artifact: AIChanger-${{ steps.version.outputs.name }}-${{ github.run_number }}
      version: ${{ steps.version.outputs.name }}

  # Отдельно от сборки: право на запись (создать релиз) нужно только здесь.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$VERSION"; fi
          notes="release-notes/$tag.md"
          # Релиз этой версии уже есть: обновляем только описание. APK оставляем тот, что собран из коммита тега.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
            exit 0
          fi
          apk="AIChanger-$tag.apk"
          mv app-release.apk "$apk"
          # --target нужен при ручном запуске: тега ещё нет, релиз создаёт его на собранном коммите.
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
            --title "AIChanger ${tag#v}" \
            --notes-file "$notes"
